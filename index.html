<!doctype html>
<html lang="sv">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Småsteg</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Atkinson+Hyperlegible:wght@400;700&family=Nunito:wght@700;800;900&display=swap">
<style>
/* =========================================================
   SMÅSTEG – designtokens
   Ljust tema definieras på :root. Mörkt tema omdefinierar
   bara tokens (systemval + explicit data-theme).
   ========================================================= */
:root{
  color-scheme: light;
  --text-scale: 1;

  --bg:#FBF7F1; --surface:#FFFDF9; --surface-2:#F4EDE3; --surface-3:#EAE0D2;
  --line:#E5DBCE; --line-strong:#B9AB9A;
  --text:#1F1B17; --text-2:#5C5249;
  --btn:#1F1B17; --on-btn:#FFFDF9;
  --focus:#1F1B17;
  --toast-bg:#1F1B17; --toast-text:#FFFDF9;

  /* illustrationens fasta färger */
  --il-w:#FFF8EF; --face:#2A1F1A; --leaf:#6FA27B; --sun:#FFD867; --cheek:#EE8F80; --cloud:#D8CEC1;
  --s1:#F3C9A8; --s2:#C98C63; --s3:#8A5A3C;
  --h1:#2B211C; --h2:#7A4526; --h3:#E3B24F;

  /* kategorier: bas (vit text ≥ 4,5:1) · t = ljus ton · k = djup ton · soft = UI-bakgrund */
  --igang:#C44E3D;      --igang-t:#F8C8BB;      --igang-k:#7E2D22;      --igang-soft:#FBE6DF;
  --planera:#7563BE;    --planera-t:#DAD2F6;    --planera-k:#3E3270;    --planera-soft:#EEEAFB;
  --tid:#8F6A00;        --tid-t:#FFD867;        --tid-k:#4F3A00;        --tid-soft:#FFF3CC;
  --minne:#2E78B5;      --minne-t:#BFE0F7;      --minne-k:#16426A;      --minne-soft:#E3F1FB;
  --fokus:#AD6134;      --fokus-t:#FFD3B3;      --fokus-k:#633114;      --fokus-soft:#FFEBDC;
  --kanslor:#AB5673;    --kanslor-t:#F4C9D6;    --kanslor-k:#62283D;    --kanslor-soft:#F9E6EC;
  --forandring:#4F7A5E; --forandring-t:#CDE3D2; --forandring-k:#294433; --forandring-soft:#E6F1E8;
  --balans:#27336B;     --balans-t:#B9C3EA;     --balans-k:#121A3D;     --balans-soft:#E4E8F7;

  --r-lg:20px; --r-md:16px; --r-sm:12px;
  --ease:cubic-bezier(.22,.8,.3,1); --dur:280ms;
  --font-head:"Nunito", ui-rounded, "Segoe UI", system-ui, sans-serif;
  --font-body:"Atkinson Hyperlegible", "Nunito", system-ui, -apple-system, "Segoe UI", sans-serif;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    color-scheme: dark;
    --bg:#1C1714; --surface:#27201B; --surface-2:#312822; --surface-3:#3D332B;
    --line:#3E342C; --line-strong:#76685A;
    --text:#F4ECE3; --text-2:#C9BCAE;
    --btn:#F4ECE3; --on-btn:#1C1714; --focus:#F4ECE3;
    --toast-bg:#F4ECE3; --toast-text:#1C1714;
    --il-w:#F1E6D8; --leaf:#5F8B69; --sun:#E6C25F; --cloud:#6E6257;
    --igang:#A84A3E;      --igang-t:#E3AFA2;      --igang-k:#5E241C;      --igang-soft:#3A2521;
    --planera:#625596;    --planera-t:#BDB3E0;    --planera-k:#2E2656;    --planera-soft:#2E2A40;
    --tid:#7A5D14;        --tid-t:#E6C25F;        --tid-k:#3B2C05;        --tid-soft:#372E17;
    --minne:#2E6696;      --minne-t:#A5C8E0;      --minne-k:#123452;      --minne-soft:#1F2E3B;
    --fokus:#8F5431;      --fokus-t:#E8BC9C;      --fokus-k:#4A250F;      --fokus-soft:#3A2A1F;
    --kanslor:#8C4D63;    --kanslor-t:#DDB0BF;    --kanslor-k:#4A1F2E;    --kanslor-soft:#3A2530;
    --forandring:#476B51; --forandring-t:#B4CDB9; --forandring-k:#1F3527; --forandring-soft:#243328;
    --balans:#3A4A86;     --balans-t:#A0AAD6;     --balans-k:#161D40;     --balans-soft:#232842;
  }
}
:root[data-theme="dark"]{
  color-scheme: dark;
  --bg:#1C1714; --surface:#27201B; --surface-2:#312822; --surface-3:#3D332B;
  --line:#3E342C; --line-strong:#76685A;
  --text:#F4ECE3; --text-2:#C9BCAE;
  --btn:#F4ECE3; --on-btn:#1C1714; --focus:#F4ECE3;
  --toast-bg:#F4ECE3; --toast-text:#1C1714;
  --il-w:#F1E6D8; --leaf:#5F8B69; --sun:#E6C25F; --cloud:#6E6257;
  --igang:#A84A3E;      --igang-t:#E3AFA2;      --igang-k:#5E241C;      --igang-soft:#3A2521;
  --planera:#625596;    --planera-t:#BDB3E0;    --planera-k:#2E2656;    --planera-soft:#2E2A40;
  --tid:#7A5D14;        --tid-t:#E6C25F;        --tid-k:#3B2C05;        --tid-soft:#372E17;
  --minne:#2E6696;      --minne-t:#A5C8E0;      --minne-k:#123452;      --minne-soft:#1F2E3B;
  --fokus:#8F5431;      --fokus-t:#E8BC9C;      --fokus-k:#4A250F;      --fokus-soft:#3A2A1F;
  --kanslor:#8C4D63;    --kanslor-t:#DDB0BF;    --kanslor-k:#4A1F2E;    --kanslor-soft:#3A2530;
  --forandring:#476B51; --forandring-t:#B4CDB9; --forandring-k:#1F3527; --forandring-soft:#243328;
  --balans:#3A4A86;     --balans-t:#A0AAD6;     --balans-k:#161D40;     --balans-soft:#232842;
}

/* kategoriomfång: sätter --base/--tint/--ink/--soft/--acc för kort och illustrationer */
.cat-igang{--base:var(--igang);--tint:var(--igang-t);--ink:var(--igang-k);--soft:var(--igang-soft);--acc:var(--minne-t)}
.cat-planera{--base:var(--planera);--tint:var(--planera-t);--ink:var(--planera-k);--soft:var(--planera-soft);--acc:var(--tid-t)}
.cat-tid{--base:var(--tid);--tint:var(--tid-t);--ink:var(--tid-k);--soft:var(--tid-soft);--acc:var(--fokus-t)}
.cat-minne{--base:var(--minne);--tint:var(--minne-t);--ink:var(--minne-k);--soft:var(--minne-soft);--acc:var(--fokus-t)}
.cat-fokus{--base:var(--fokus);--tint:var(--fokus-t);--ink:var(--fokus-k);--soft:var(--fokus-soft);--acc:var(--planera-t)}
.cat-kanslor{--base:var(--kanslor);--tint:var(--kanslor-t);--ink:var(--kanslor-k);--soft:var(--kanslor-soft);--acc:var(--forandring-t)}
.cat-forandring{--base:var(--forandring);--tint:var(--forandring-t);--ink:var(--forandring-k);--soft:var(--forandring-soft);--acc:var(--igang-t)}
.cat-balans{--base:var(--balans);--tint:var(--balans-t);--ink:var(--balans-k);--soft:var(--balans-soft);--acc:var(--fokus-t)}

/* illustrationsklasser: fyllning (f-) och linje (s-) */
.il{display:block;overflow:visible}
.il .f-w{fill:var(--il-w)} .il .f-t{fill:var(--tint)} .il .f-k{fill:var(--ink)} .il .f-a{fill:var(--acc)} .il .f-b{fill:var(--cut,var(--base))}
.il .f-s1{fill:var(--s1)} .il .f-s2{fill:var(--s2)} .il .f-s3{fill:var(--s3)}
.il .f-h1{fill:var(--h1)} .il .f-h2{fill:var(--h2)} .il .f-h3{fill:var(--h3)}
.il .f-face{fill:var(--face)} .il .f-leaf{fill:var(--leaf)} .il .f-sun{fill:var(--sun)} .il .f-cheek{fill:var(--cheek)} .il .f-cloud{fill:var(--cloud)}
.il .ln{fill:none;stroke-linecap:round;stroke-linejoin:round}
.il .s-w{stroke:var(--il-w)} .il .s-t{stroke:var(--tint)} .il .s-k{stroke:var(--ink)} .il .s-a{stroke:var(--acc)} .il .s-b{stroke:var(--base)}
.il .s-s1{stroke:var(--s1)} .il .s-s2{stroke:var(--s2)} .il .s-s3{stroke:var(--s3)}
.il .s-face{stroke:var(--face)} .il .s-leaf{stroke:var(--leaf)}

/* =========================================================
   Grund
   ========================================================= */
*,*::before,*::after{box-sizing:border-box}
[hidden]{display:none!important}
html{font-size:calc(100% * var(--text-scale));height:100%;-webkit-text-size-adjust:100%}
body{
  margin:0;min-height:100%;
  background:var(--bg);color:var(--text);
  font-family:var(--font-body);font-size:1.0625rem;line-height:1.6;
  -webkit-font-smoothing:antialiased;
}
button,input{font:inherit;color:inherit}
button{cursor:pointer;background:none;border:0;padding:0;text-align:inherit}
h1,h2,h3{font-family:var(--font-head);font-weight:800;line-height:1.2;margin:0;text-wrap:balance;letter-spacing:-.005em}
h1{font-size:1.75rem}
h2{font-size:1.3125rem}
h3{font-size:1.125rem}
p{margin:0}
a{color:inherit}
:focus-visible{outline:3px solid var(--focus);outline-offset:3px;border-radius:10px}
[tabindex="-1"]:focus{outline:none}
.sr-only{position:absolute;width:1px;height:1px;padding:0;margin:-1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap;border:0}

#app{max-width:34rem;margin:0 auto;min-height:100%;display:flex;flex-direction:column}
.enter{animation:enter var(--dur) var(--ease)}
@keyframes enter{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}

/* rörelse av: systemval eller appens inställning */
@media (prefers-reduced-motion: reduce){
  *,*::before,*::after{animation-duration:.01ms!important;animation-iteration-count:1!important;transition-duration:.01ms!important;scroll-behavior:auto!important}
}
:root[data-motion="reduce"] *,:root[data-motion="reduce"] *::before,:root[data-motion="reduce"] *::after{animation-duration:.01ms!important;transition-duration:.01ms!important}

/* =========================================================
   Sidlayout
   ========================================================= */
.topbar{display:flex;align-items:center;justify-content:space-between;gap:12px;min-height:64px;padding-inline:16px;padding-top:8px}
.tb-left,.tb-right{display:flex;align-items:center;gap:4px;min-height:48px}
.tb-right{margin-left:auto}
.page{flex:1;padding-inline:16px;padding-block:8px 120px;display:flex;flex-direction:column;gap:32px}
.page.flow{padding-bottom:24px}
.stack{display:flex;flex-direction:column;gap:12px}
.stack-lg{display:flex;flex-direction:column;gap:20px}
.eyebrow{font-family:var(--font-head);font-weight:800;font-size:1rem;color:var(--text-2);letter-spacing:.01em}
.lead{color:var(--text-2);max-width:36ch}
.sub{color:var(--text-2);margin-top:2px}
.section-head{display:flex;flex-direction:column;gap:2px;margin-bottom:14px}
.greet{font-size:1.625rem}
.date{color:var(--text-2);font-size:1rem}

/* knappar */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:10px;min-height:52px;padding:0 24px;border-radius:999px;font-family:var(--font-head);font-weight:800;font-size:1.0625rem;transition:transform var(--dur) var(--ease),background-color var(--dur) var(--ease)}
.btn:active{transform:scale(.98)}
.btn-primary{background:var(--btn);color:var(--on-btn)}
.btn-secondary{background:var(--surface-2);color:var(--text)}
.btn-wide{width:100%}
.btn-text{display:inline-flex;align-items:center;gap:6px;min-height:48px;padding:0 12px;border-radius:999px;font-family:var(--font-head);font-weight:800;font-size:1.0625rem;color:var(--text);text-decoration:underline;text-decoration-thickness:2px;text-underline-offset:4px;text-decoration-color:var(--line-strong)}
.btn-icon{display:inline-grid;place-items:center;width:48px;height:48px;border-radius:999px;color:var(--text)}
.btn-icon:hover{background:var(--surface-2)}
.btn-icon svg,.btn-text svg,.btn svg{width:24px;height:24px;flex:none}
.btn-back{display:inline-flex;align-items:center;gap:4px;min-height:48px;padding:0 14px 0 6px;border-radius:999px;font-family:var(--font-head);font-weight:800}
.btn-back svg{width:24px;height:24px}
.btn-back:hover{background:var(--surface-2)}
.btn-round{display:grid;place-items:center;width:60px;height:60px;border-radius:999px;background:var(--btn);color:var(--on-btn);flex:none;transition:transform var(--dur) var(--ease)}
.btn-round:active{transform:scale(.94)}
.btn-round svg{width:26px;height:26px}
.btn-round[aria-disabled="true"]{opacity:.45}

/* ordmärke */
.logo{display:inline-flex;align-items:center;gap:8px;font-family:var(--font-head);font-weight:900;font-size:1.25rem;letter-spacing:-.01em}
.logo svg{width:30px;height:24px}

/* flödesfot: stegindikator + nästa */
.flowbar{position:sticky;bottom:0;display:flex;align-items:center;gap:16px;padding:12px 16px calc(14px + env(safe-area-inset-bottom,0px));background:var(--bg);border-top:1px solid var(--line)}
.stepbar{flex:1;display:flex;gap:6px;align-items:center}
.stepbar span{flex:1;height:4px;border-radius:4px;background:var(--line)}
.stepbar span.on{background:var(--text)}
.stepbar span.done{background:var(--text-2)}

/* val (onboarding m.m.) */
.choices{display:flex;flex-direction:column;gap:10px}
.choice{display:flex;align-items:center;gap:14px;width:100%;min-height:60px;padding:12px 16px;border-radius:var(--r-md);background:var(--surface);border:2px solid var(--line);font-size:1.0625rem;line-height:1.35;transition:border-color var(--dur) var(--ease),background-color var(--dur) var(--ease)}
.choice:hover{border-color:var(--line-strong)}
.choice[aria-pressed="true"]{border-color:var(--text);background:var(--soft,var(--surface-2))}
.choice .c-text{flex:1;display:flex;flex-direction:column;gap:2px}
.choice .c-title{font-weight:700}
.choice .c-desc{color:var(--text-2);font-size:1rem}
.choice .dot{width:16px;height:16px;border-radius:999px;background:var(--base);flex:none}
.choice .c-icon{display:grid;place-items:center;width:44px;height:44px;border-radius:12px;background:var(--surface-2);flex:none;color:var(--text)}
.choice[aria-pressed="true"] .c-icon{background:var(--surface)}
.choice .c-icon svg{width:26px;height:26px}
.choice .mark{display:grid;place-items:center;width:30px;height:30px;border-radius:999px;border:2px solid var(--line-strong);flex:none;font-family:var(--font-head);font-weight:900;font-size:1rem}
.choice[aria-pressed="true"] .mark{background:var(--text);border-color:var(--text);color:var(--bg)}
.choice .mark svg{width:18px;height:18px}
.hint{min-height:1.6em;color:var(--text);font-weight:700}
.wave svg{width:44px;height:30px}

.field{display:flex;flex-direction:column;gap:8px}
.field label{font-weight:700}
.input{width:100%;min-height:52px;padding:12px 16px;border-radius:var(--r-sm);border:2px solid var(--line-strong);background:var(--surface);font-size:1.0625rem}
.input:focus-visible{outline:3px solid var(--focus);outline-offset:2px}
.counter{color:var(--text-2);font-size:1rem}

/* =========================================================
   Kategorikort
   ========================================================= */
.card{position:relative;display:flex;flex-direction:column;width:100%;margin-top:24px;border-radius:var(--r-lg);background:var(--base);color:#fff;text-align:left;overflow:visible;transition:transform var(--dur) var(--ease)}
button.card:active{transform:scale(.985)}
.card-illu{display:flex;justify-content:flex-end;height:168px;padding-right:8px;margin-top:-24px;pointer-events:none}
.card-illu .il{height:100%;width:auto;max-width:100%}
.card-body{display:flex;flex-direction:column;gap:4px;padding:6px 18px 18px}
.card-meta{font-size:1rem;font-weight:700;color:#fff}
.card-title{font-family:var(--font-head);font-weight:800;font-size:1.375rem;line-height:1.2;color:#fff;text-wrap:balance}
.card-under{font-size:1rem;color:#fff}
.card-foot{display:flex;align-items:center;justify-content:space-between;gap:12px;margin-top:10px}
.pill{display:inline-flex;align-items:center;gap:6px;min-height:32px;padding:2px 12px;border-radius:999px;background:var(--ink);color:#fff;font-size:1rem;font-weight:700}
.pill svg{width:18px;height:18px}
.play-dot{display:grid;place-items:center;width:52px;height:52px;border-radius:999px;background:#fff;color:var(--ink);flex:none}
.play-dot svg{width:24px;height:24px;margin-left:3px}

/* Idag: energirad */
.energy-row{display:flex;align-items:center;justify-content:space-between;gap:8px;padding:8px 6px 8px 16px;border-radius:var(--r-md);background:var(--surface-2)}
.e-lab{display:flex;flex-direction:column;line-height:1.3}
.e-lab small{font-size:1rem;color:var(--text-2)}
.e-lab b{font-family:var(--font-head);font-weight:800;font-size:1.125rem}
.welcome{padding:16px 18px;border-radius:var(--r-md);background:var(--surface-2)}

/* Idag: dagens steg klart */
.soft-card{--cut:var(--soft);display:flex;gap:16px;align-items:center;padding:16px;border-radius:var(--r-lg);background:var(--soft)}
.soft-card .stack{gap:6px}

/* Just nu */
.jn-list{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:10px}
.jn-row{display:flex;align-items:center;gap:14px;width:100%;min-height:72px;padding:8px 12px 8px 8px;border-radius:var(--r-md);background:var(--surface);border:2px solid var(--line)}
.jn-row:hover{border-color:var(--line-strong)}
.jn-tile{display:grid;place-items:center;width:56px;height:56px;border-radius:14px;background:var(--base);flex:none}
.jn-tile svg{width:34px;height:34px}
.jn-text{flex:1;display:flex;flex-direction:column}
.jn-title{font-family:var(--font-head);font-weight:800;font-size:1.125rem;line-height:1.25}
.jn-meta{color:var(--text-2);font-size:1rem}
.chev{width:22px;height:22px;color:var(--text-2);flex:none}
.e-tile{display:grid;place-items:end center;width:76px;height:64px;border-radius:14px;background:var(--base);overflow:hidden;flex:none}
.e-tile svg{width:76px;height:auto}

/* Dagsplan */
.plan{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:10px}
.plan-item{display:flex;align-items:center;gap:8px;min-height:64px;padding:6px 4px 6px 8px;border-radius:var(--r-md);background:var(--surface);border:2px solid var(--line);transition:background-color var(--dur) var(--ease)}
.plan-item.is-done{background:var(--surface-2);border-color:transparent}
.check{display:grid;place-items:center;width:48px;height:48px;border-radius:999px;flex:none}
.check span{display:grid;place-items:center;width:32px;height:32px;border-radius:999px;border:2.5px solid var(--line-strong);color:transparent;transition:background-color var(--dur) var(--ease),border-color var(--dur) var(--ease)}
.check svg{width:20px;height:20px;stroke-width:3}
.check[aria-pressed="true"] span{background:var(--forandring);border-color:var(--forandring);color:#fff}
.plan-text{flex:1;display:flex;flex-direction:column;line-height:1.35}
.is-done .plan-text .pt{color:var(--text-2)}
.plan-src{font-size:1rem;color:var(--text-2)}
.plan-empty{display:flex;align-items:center;gap:12px;width:100%;min-height:64px;padding:8px 16px;border-radius:var(--r-md);border:2px dashed var(--line-strong);color:var(--text);font-weight:700}
.plan-empty svg{width:24px;height:24px}
.plan-editor{padding:16px;border-radius:var(--r-md);background:var(--surface);border:2px solid var(--text);display:flex;flex-direction:column;gap:14px}
.ideas{display:flex;flex-wrap:wrap;gap:8px}
.idea{min-height:44px;padding:6px 14px;border-radius:999px;background:var(--surface-2);font-size:1rem;font-weight:700}
.idea-wrap{display:flex;flex-direction:column;gap:8px}
.idea-wrap p{color:var(--text-2);font-size:1rem}
.row-end{display:flex;justify-content:flex-end;gap:8px;flex-wrap:wrap}
.empty{display:flex;align-items:center;gap:16px;padding:4px 0 8px}
.empty .il{width:88px;flex:none;padding:6px;border-radius:14px;background:var(--soft)}
/* Utforska */
.explore{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));column-gap:10px;row-gap:34px;padding-top:14px}
.gcard{display:flex;flex-direction:column;width:100%;min-height:100%;border-radius:var(--r-lg);background:var(--base);color:#fff;text-align:left;transition:transform var(--dur) var(--ease)}
.gcard:active{transform:scale(.97)}
.g-illu{display:flex;justify-content:center;height:122px;margin-top:-22px;padding-inline:4px;pointer-events:none}
.g-illu .il{height:100%;width:auto;max-width:100%}
.g-body{display:flex;flex-direction:column;align-items:flex-start;gap:2px;margin-top:auto;padding:8px 12px 14px}
.g-title{font-family:var(--font-head);font-weight:800;font-size:1.125rem;line-height:1.2;color:#fff;hyphens:manual;overflow-wrap:break-word}
.g-under{font-size:1rem;line-height:1.35;color:#fff;hyphens:manual;overflow-wrap:break-word}
.g-pill{margin-bottom:6px;min-height:28px;font-size:.9375rem}

/* Kategori- och programsidor */
.prog-card{display:flex;flex-direction:column;gap:12px;width:100%;padding:16px;border-radius:var(--r-lg);background:var(--surface);border:2px solid var(--line);text-align:left}
.prog-card:hover,.part:hover{border-color:var(--line-strong)}
.p-top{display:flex;align-items:center;gap:12px}
.p-text{flex:1;display:flex;flex-direction:column}
.p-title{font-family:var(--font-head);font-weight:800;font-size:1.1875rem;line-height:1.25}
.p-meta{color:var(--text-2);font-size:1rem}
.p-status{font-weight:700}
.segs{display:flex;gap:6px}
.segs span{flex:1;height:6px;border-radius:6px;background:var(--line)}
.segs span.on{background:var(--base)}
.parts{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:10px}
.part{display:flex;align-items:center;gap:14px;width:100%;min-height:68px;padding:10px 12px 10px 10px;border-radius:var(--r-md);background:var(--surface);border:2px solid var(--line);text-align:left}
.part .p-title{font-size:1.0625rem}
.part.is-next{border-color:var(--text)}
.part .num{display:grid;place-items:center;width:40px;height:40px;border-radius:999px;background:var(--surface-2);font-family:var(--font-head);font-weight:900;flex:none}
.part .num svg{width:20px;height:20px;stroke-width:3}
.part.is-done .num{background:var(--base);color:#fff}
.part.is-next .num{background:var(--text);color:var(--bg)}
.tags{display:flex;flex-wrap:wrap;gap:6px;margin-top:6px}
.tag{display:inline-flex;align-items:center;min-height:28px;padding:0 10px;border-radius:999px;background:var(--surface-2);font-size:1rem;line-height:1.2}
.st-tile{color:#fff}
.st-tile svg{width:26px;height:26px;margin-left:3px}

/* Dagsplan: reflektion efter en övning */
.plan-reflect{display:flex;flex-direction:column;gap:10px;padding:14px;border-radius:var(--r-md);background:var(--surface-2)}
.mini-choices{display:flex;flex-wrap:wrap;gap:8px}
.mini-choice{display:inline-flex;align-items:center;gap:6px;min-height:48px;padding:0 16px 0 8px;border-radius:999px;background:var(--surface);border:2px solid var(--line);font-family:var(--font-head);font-weight:800}
.mini-choice .weather svg{width:30px;height:30px}
.all-done{display:flex;flex-direction:column;gap:6px;align-items:flex-start;padding:16px 18px;border-radius:var(--r-md);background:var(--forandring-soft)}

/* Bottenmeny */
.tabbar{position:fixed;left:0;right:0;bottom:0;z-index:5;background:var(--surface);border-top:1px solid var(--line);padding-bottom:env(safe-area-inset-bottom,0px)}
.tabbar-in{max-width:34rem;margin:0 auto;display:grid;grid-template-columns:repeat(3,1fr)}
.tab{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;min-height:64px;font-family:var(--font-head);font-weight:800;font-size:.9375rem;color:var(--text-2)}
.tab .tab-ic{display:grid;place-items:center;width:56px;height:30px;border-radius:999px;transition:background-color var(--dur) var(--ease)}
.tab svg{width:24px;height:24px}
.tab[aria-current="page"]{color:var(--text)}
.tab[aria-current="page"] .tab-ic{background:var(--surface-3)}

/* Session */
.video{position:relative;display:block;width:100%;aspect-ratio:16/10;max-width:100%;border-radius:var(--r-lg);background:var(--base);overflow:hidden;color:#fff}
.video .il{position:absolute;inset:8% 4% 0 auto;height:92%;width:auto}
.video .v-play{position:absolute;left:18px;top:50%;transform:translateY(-50%);display:grid;place-items:center;width:68px;height:68px;border-radius:999px;background:#fff;color:var(--ink)}
.video .v-play svg{width:30px;height:30px;margin-left:4px}
.video .v-len{position:absolute;left:14px;bottom:14px}
.prose{display:flex;flex-direction:column;gap:14px;max-width:38rem}
.listen{align-self:flex-start;display:inline-flex;align-items:center;gap:8px;min-height:48px;padding:0 18px 0 14px;border-radius:999px;background:var(--surface-2);font-family:var(--font-head);font-weight:800}
.listen svg{width:22px;height:22px}
.listen[aria-pressed="true"]{background:var(--btn);color:var(--on-btn)}
.steps{list-style:none;margin:0;padding:0;counter-reset:s;display:flex;flex-direction:column;gap:12px}
.steps li{counter-increment:s;display:flex;gap:14px;align-items:flex-start}
.steps li::before{content:counter(s);display:grid;place-items:center;width:34px;height:34px;border-radius:999px;background:var(--base);color:#fff;font-family:var(--font-head);font-weight:900;flex:none;margin-top:-2px}
.tip{padding:14px 16px;border-radius:var(--r-md);background:var(--soft)}
.examples{display:flex;flex-direction:column;gap:10px}
.example{display:flex;gap:12px;align-items:flex-start;padding:12px 14px;border-radius:var(--r-md);background:var(--surface);border:2px solid var(--line)}
.example svg{width:24px;height:24px;flex:none;margin-top:2px}
.example b{display:block;font-family:var(--font-head);font-weight:800}
.chip{display:inline-flex;align-items:center;gap:6px;min-height:32px;padding:2px 12px;border-radius:999px;background:var(--surface-2);font-size:1rem;font-weight:700}
.chip svg{width:20px;height:20px}
.prose .chip{align-self:flex-start}
.chip-dev{background:transparent;border:2px dashed var(--line-strong);color:var(--text-2)}
.weather svg{width:34px;height:34px}

/* Sammanfattning */
.sum-list{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:14px}
.sum-list li{display:flex;gap:14px;align-items:flex-start}
.sum-list .c-icon{display:grid;place-items:center;width:44px;height:44px;border-radius:12px;background:var(--surface-2);flex:none}
.sum-list svg{width:24px;height:24px}
.sum-list b{display:block;font-family:var(--font-head);font-weight:800}

/* Menysidor */
.menu-list{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:10px}
.menu-row{display:flex;align-items:center;gap:14px;width:100%;min-height:68px;padding:10px 14px;border-radius:var(--r-md);background:var(--surface);border:2px solid var(--line);font-family:var(--font-head);font-weight:800;font-size:1.125rem}
.menu-row .c-icon{display:grid;place-items:center;width:44px;height:44px;border-radius:12px;background:var(--surface-2);flex:none}
.menu-row .c-icon svg{width:24px;height:24px}
.menu-row .m-text{flex:1;display:flex;flex-direction:column}
.menu-row small{font-family:var(--font-body);font-weight:400;font-size:1rem;color:var(--text-2)}
.help-card{display:flex;flex-direction:column;gap:6px;padding:18px;border-radius:var(--r-md);background:var(--surface);border:2px solid var(--line)}
.help-card.urgent{border-color:var(--text)}
.help-num{font-family:var(--font-head);font-weight:900;font-size:2rem;line-height:1.1;letter-spacing:.02em;font-variant-numeric:tabular-nums}
.help-actions{display:flex;flex-wrap:wrap;gap:8px;margin-top:6px}
.placeholder{--cut:var(--soft);display:flex;flex-direction:column;align-items:flex-start;gap:14px;padding:22px;border-radius:var(--r-lg);background:var(--soft)}
.illu-block{--cut:var(--base);display:flex;justify-content:center;align-items:flex-end;align-self:stretch;padding:18px 16px 0;border-radius:var(--r-lg);background:var(--base);overflow:hidden}
.illu-block .il{width:100%;max-width:240px;height:auto}
.illu-block.sm{align-self:center;width:96px;padding:8px 6px 0;border-radius:14px;flex:none}
.confirm{display:flex;flex-direction:column;gap:12px;padding:16px;border-radius:var(--r-md);border:2px solid var(--text);background:var(--surface)}
.goal-box{display:flex;gap:14px;align-items:flex-start;padding:18px;border-radius:var(--r-lg);background:var(--surface);border:2px solid var(--line)}
.goal-box svg{width:28px;height:28px;flex:none}

/* Toast */
#toast{position:fixed;left:50%;bottom:calc(84px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);z-index:20;width:min(30rem,calc(100% - 32px));display:flex;align-items:center;justify-content:space-between;gap:12px;padding:14px 16px 14px 20px;border-radius:var(--r-md);background:var(--toast-bg);color:var(--toast-text);font-weight:700;animation:enter var(--dur) var(--ease)}
body[data-view="session"] #toast,body[data-view="onboarding"] #toast,body[data-view="checkin"] #toast{bottom:calc(96px + env(safe-area-inset-bottom,0px))}
#toast button{min-height:44px;padding:0 14px;border-radius:999px;background:var(--toast-text);color:var(--toast-bg);font-family:var(--font-head);font-weight:800}

@media (min-width:600px){
  h1{font-size:2rem}
  .card-illu{height:190px}
}
</style>

function load(){
  try {
    var raw = localStorage.getItem(KEY);
    if (!raw) return defaultState();
    var s = JSON.parse(raw), d = defaultState();
    for (var k in d) if (!(k in s)) s[k] = d[k];
    return s;
  } catch (e) { return defaultState(); }
}

function pad(n){ return String(n).padStart(2, '0'); }
function dateKey(d){ d = d || new Date(); return d.getFullYear() + '-' + pad(d.getMonth() + 1) + '-' + pad(d.getDate()); }
function today(){ return dateKey(); }
function daysBetween(a, b){ return Math.round((new Date(b + 'T12:00') - new Date(a + 'T12:00')) / 864e5); }
function esc(s){ return String(s).replace(/[&<>"']/g, function(c){ return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]; }); }
function uid(){ return Math.random().toString(36).slice(2, 9); }

  'Uppmärksamhet': 'Upp\u00ADmärksamhet', 'Tidsuppfattning': 'Tids\u00ADuppfattning', 'Igångsättning': 'Igångs\u00ADättning',

function shy(t){ return t.replace(/[A-Za-zÅÄÖåäö]+/g, function(w){ return SHY[w] || w; }); }
function cap(s){ return s.charAt(0).toUpperCase() + s.slice(1); }
function listJoin(arr){ if (arr.length < 2) return arr.join(''); return arr.slice(0, -1).join(', ') + ' och ' + arr[arr.length - 1]; }

function isShort(){ return S.settings.sessionLength === 'kort' || S.profile.energyBaseline === 'lag' || energyToday() === 'lite'; }

function doneIds(){ var d = {}; S.completed.forEach(function(c){ d[c.sessionId] = true; }); return d; }
function progState(pid){
  var p = PROG[pid], d = doneIds(), done = 0, next = null;
  p.delar.forEach(function(x){ if (d[x.id]) done++; else if (!next) next = x; });
  return { done: done, total: p.delar.length, next: next };
}
/* strategier i en kategori, de som matchar användarens livsområden först */
function catStrategies(catId){
  var areas = S.profile.lifeAreas;
  return C.strategier.filter(function(x){ return x.kategori === catId; })
    .map(function(x, i){ return { x: x, i: i, m: x.livsomraden.some(function(a){ return areas.indexOf(a) > -1; }) ? 0 : 1 }; })
    .sort(function(a, b){ return a.m - b.m || a.i - b.i; })
    .map(function(o){ return o.x; });
}
function suggestedStrategy(){
  var d = doneIds(), cats = S.profile.challenges.length ? S.profile.challenges : ['planera'];
  for (var i = 0; i < cats.length; i++) {
    var open = catStrategies(cats[i]).filter(function(x){ return !d[x.id]; });
    if (open.length) return open[0];
  }
  return catStrategies(cats[0])[0];
}

function planToday(){

function head(cx, cy, r, o){
  o = o || {};

  if (st === 'bun') back = '<circle cx="' + (cx + r * 0.5) + '" cy="' + (cy - r * 0.95) + '" r="' + (r * 0.46) + '" class="f-' + hr + '"/>';
  if (st === 'curly') {
    [200, 235, 270, 305, 340].forEach(function(a){
      var rad = a * Math.PI / 180;
      top += '<circle cx="' + (cx + Math.cos(rad) * r * 0.78).toFixed(1) + '" cy="' + (cy + Math.sin(rad) * r * 0.78).toFixed(1) + '" r="' + (r * 0.42).toFixed(1) + '" class="f-' + hr + '"/>';
    });
  } else {
    top = '<path d="M' + (cx - r) + ' ' + cy + 'A' + r + ' ' + r + ' 0 0 1 ' + (cx + r) + ' ' + cy + 'Q' + (cx + r * 0.25) + ' ' + (cy - r * 0.72) + ' ' + (cx - r) + ' ' + cy + 'Z" class="f-' + hr + '"/>';
  }

    eyes = '<path d="M' + (cx - 10 + lx) + ' ' + (cy + 4) + 'q3 3 6 0M' + (cx + 4 + lx) + ' ' + (cy + 4) + 'q3 3 6 0" class="ln s-face" stroke-width="2.2"/>';

/* =========================================================
   Uppläsning (webbläsarens talsyntes, svenska)
   ========================================================= */
var TTS = {
  ok: 'speechSynthesis' in window && 'SpeechSynthesisUtterance' in window,
  voice: null, on: false, warned: false,
  init: function(){
    if (!this.ok) return;
    var self = this;
    function pick(){ var v = window.speechSynthesis.getVoices(); self.voice = v.filter(function(x){ return /^sv([-_]|$)/i.test(x.lang); })[0] || null; }
    pick();
    try { window.speechSynthesis.addEventListener('voiceschanged', pick); } catch (e) {}
  },
  toggle: function(text){
    if (!this.ok) return;
    if (this.on) { this.stop(); return; }
    var self = this, u = new SpeechSynthesisUtterance(text);
    u.lang = 'sv-SE'; u.rate = 0.92;
    if (this.voice) u.voice = this.voice;
    u.onend = u.onerror = function(){ self.on = false; syncListen(); };
    window.speechSynthesis.cancel();
    window.speechSynthesis.speak(u);
    this.on = true; syncListen();
    if (!this.voice && !this.warned) { this.warned = true; toast('Hittade ingen svensk röst på enheten. Uppläsningen kan låta konstig.'); }
  },
  stop: function(){ if (this.ok) window.speechSynthesis.cancel(); this.on = false; syncListen(); }
};
function syncListen(){
  var b = document.querySelector('[data-act="listen"]');
  if (!b) return;
  b.setAttribute('aria-pressed', TTS.on ? 'true' : 'false');
  b.innerHTML = (TTS.on ? ICON.stop + 'Sluta läsa' : ICON.speaker + 'Lyssna');
}
function listenBtn(){ return TTS.ok && S.settings.tts ? '<button class="listen" data-act="listen" aria-pressed="false" data-key="listen">' + ICON.speaker + 'Lyssna</button>' : ''; }

var toastTimer = null, toastAction = null;
function toast(msg, action){
  var t = document.getElementById('toast');
  toastAction = action || null;
  t.innerHTML = '<span>' + esc(msg) + '</span>' + (action ? '<button type="button" id="toast-btn">' + esc(action.label) + '</button>' : '');
  t.hidden = false;
  clearTimeout(toastTimer);
  toastTimer = setTimeout(function(){ t.hidden = true; toastAction = null; }, action ? 6000 : 3200);
}
document.getElementById('toast').addEventListener('click', function(e){
  if (e.target.id === 'toast-btn' && toastAction) { var fn = toastAction.fn; toastAction = null; this.hidden = true; fn(); }
});

  return '<li><button class="jn-row" data-act="open-session" data-id="' + x.id + '" data-key="st-' + x.id + '">' +
    '<span class="jn-tile st-tile cat-' + x.kategori + '">' + ICON.play + '</span>' +
    '<span class="jn-text"><span class="jn-title">' + x.titel + '</span><span class="jn-meta">tar ' + minutesFor(x) + ' min' + (done ? ' · gjord' : '') + '</span>' +
    '<span class="tags">' + x.livsomraden.map(function(a){ return '<span class="tag">' + AREA[a].titel + '</span>'; }).join('') + '</span></span>' + ICON.chevR + '</button></li>';
}
function justNuSection(){
  var list = C.justNu.slice();
  if (energyToday() === 'lite') list.sort(function(a, b){ return (b.id === 'jn-slut') - (a.id === 'jn-slut'); });
  return '<ul class="jn-list">' + list.map(function(j){
    return '<li><button class="jn-row" data-act="open-justnu" data-id="' + j.id + '" data-key="jn-' + j.id + '">' +
      '<span class="jn-tile cat-' + j.kategori + '">' + JN_GLYPH[j.id] + '</span>' +
      '<span class="jn-text"><span class="jn-title">' + j.titel + '</span><span class="jn-meta">tar ' + j.min + ' min</span></span>' + ICON.chevR + '</button></li>';
  }).join('') + '</ul>';
}
function planIdeas(){
  var areas = S.profile.lifeAreas.length ? S.profile.lifeAreas : null, out = [];
  if (!areas) return C.dagsplanForslagAllmant.slice(0, 3);
  var i = 0;
  while (out.length < 3 && i < 9) {
    var a = AREA[areas[i % areas.length]], idea = a.dagsplanForslag[Math.floor(i / areas.length)];
    if (idea && out.indexOf(idea) < 0) out.push(idea);
    i++;
  }
  return out;
}
function slotsText(n){ return n === 1 ? 'En sak räcker idag.' : n === 2 ? 'Två saker räcker gott.' : 'Upp till tre saker idag.'; }
function planSection(){
  var plan = planToday(), slots = slotsToday() + (plan.extra || 0), items = plan.items;
  var empties = Math.max(0, slots - items.length), html = '';
  var allDone = items.length > 0 && items.every(function(i){ return i.done; });
  if (!items.length && !V.planEdit) {
    html += '<div class="empty cat-planera">' + mini('plan') + '<p>Vad vill du hinna med idag? Skriv in det här, så slipper du hålla det i huvudet.</p></div>';
  }
  html += '<ul class="plan">';
  items.forEach(function(it){
    html += '<li class="plan-item' + (it.done ? ' is-done' : '') + '">' +
      '<button class="check" data-act="plan-toggle" data-id="' + it.id + '" data-key="pt-' + it.id + '" aria-pressed="' + !!it.done + '" aria-label="Gjort: ' + esc(it.text) + '"><span>' + ICON.check + '</span></button>' +
      '<span class="plan-text"><span class="pt">' + esc(it.text) + '</span>' + (it.src === 'session' ? '<span class="plan-src">' + (SESS[it.sessionId] && SESS[it.sessionId].typ === 'strategi' ? 'Från en strategi' : 'Från dagens steg') + '</span>' : '') + '</span>' +
      '<button class="btn-icon" data-act="plan-remove" data-id="' + it.id + '" data-key="pr-' + it.id + '" aria-label="Ta bort: ' + esc(it.text) + '">' + ICON.close + '</button></li>';
    if (V.reflectFor === it.id && it.done && !it.reflection) {
      html += '<li class="plan-reflect"><p><b>Hur gick övningen?</b></p><div class="mini-choices">' + C.reflektion.val.map(function(r){
        return '<button class="mini-choice" data-act="plan-reflect" data-id="' + it.id + '" data-r="' + r.id + '" data-key="prf-' + r.id + '">' + weatherIcon(r.id) + r.kort + '</button>';
      }).join('') + '</div></li>';
    }
  });
  for (var i = 0; i < empties; i++) {
    if (i === 0 && V.planEdit) {
      html += '<li class="plan-editor"><form data-form="plan" class="stack" novalidate>' +
        '<div class="field"><label for="plan-input">Vad vill du göra?</label><input class="input" id="plan-input" type="text" maxlength="60" autocomplete="off" data-autofocus data-key="plan-input"></div>' +
        '<div class="idea-wrap"><p>Förslag</p><div class="ideas">' + planIdeas().map(function(x){ return '<button type="button" class="idea" data-act="plan-idea" data-text="' + esc(x) + '">' + esc(x) + '</button>'; }).join('') + '</div></div>' +
        '<div class="row-end"><button type="button" class="btn btn-secondary" data-act="plan-cancel">Avbryt</button><button type="submit" class="btn btn-primary">Spara</button></div>' +
        '</form></li>';
    } else {
      html += '<li><button class="plan-empty" data-act="plan-add" data-key="add-' + i + '">' + ICON.plus + 'Lägg till något</button></li>';
    }
  }
  html += '</ul>';
  if (allDone && empties === 0) {
    html += '<div class="all-done"><p><b>Allt i dagsplanen är gjort.</b> Det räcker gott för idag.</p>' +
      (items.length < 5 ? '<button class="btn-text" data-act="plan-extra" data-key="extra" style="padding-left:0">Jag vill lägga till en sak till</button>' : '') + '</div>';
  }
  return html;
}

/* =========================================================
   SESSION: förklaring → strategi → övning → reflektion
   ========================================================= */
function sessionText(s, step, short){
  if (step === 0) return s.titel + '. ' + (short ? s.forklaring.kort : s.forklaring.text.join(' '));
  if (step === 1) return s.strategi.titel + '. ' + s.strategi.steg.join(' ') + ' ' + (s.strategi.tips || '');
  if (step === 2) return 'Din övning idag. ' + s.ovning.text;
  return '';
}
function examplesFor(s){
  var areas = S.profile.lifeAreas.filter(function(a){ return s.exempel[a]; }).slice(0, 2);
  if (!areas.length) areas = ['hem'];
  return areas.map(function(a){ return '<div class="example">' + ICON[AREA[a].ikon] + '<span><b>' + AREA[a].titel + '</b>' + s.exempel[a] + '</span></div>'; }).join('');
}
function vSession(){
  var s = SESS[V.sid], isDel = s.typ === 'del', prog = isDel ? PROG[s.programId] : null, cat = CAT[isDel ? prog.kategori : s.kategori];
  var step = V.step, short = isShort(), body = '';
  var eyebrow = '<p class="eyebrow">' + (isDel ? prog.titel + ' · Del ' + s.del + ' av ' + prog.delar.length : 'Strategi · ' + cat.titel) + (short ? ' · Kort version' : '') + '</p>';
  if (step === 0) {
    body = eyebrow + '<h1>' + s.titel + '</h1>' +
      (short ? '' : '<button class="video" data-act="video" data-key="video" aria-label="' + s.forklaring.film.beskrivning + ', ' + s.forklaring.film.langd + ' lång. Inte inspelad än.">' + scene(cat.id) + '<span class="v-play">' + ICON.play + '</span><span class="pill v-len">' + ICON.clock + s.forklaring.film.langd + '</span></button>') +
      '<div class="prose">' + listenBtn() + '<h2>Varför hjälper det?</h2>' +
      (short ? '<p>' + s.forklaring.kort + '</p>' : s.forklaring.text.map(function(p){ return '<p>' + p + '</p>'; }).join('')) + '</div>';
  } else if (step === 1) {
    body = eyebrow + '<h1>' + s.strategi.titel + '</h1><div class="prose">' + listenBtn() +
      '<ol class="steps">' + s.strategi.steg.map(function(x){ return '<li><span>' + x + '</span></li>'; }).join('') + '</ol>' +
      (s.strategi.tips ? '<p class="tip">' + s.strategi.tips + '</p>' : '') +
      '<h2>Så kan det se ut</h2><div class="examples">' + examplesFor(s) + '</div></div>';
  } else if (step === 2) {
    var added = planToday().items.some(function(i){ return i.sessionId === s.id; });
    body = eyebrow + '<h1>Din övning idag</h1><div class="prose">' + listenBtn() +
      '<p class="tip" style="font-size:1.1875rem;font-weight:700">' + s.ovning.text + '</p>' +
      '<p>Lägg den i dagsplanen, så slipper du komma ihåg den.</p>' +
      (added ? '<p class="chip">' + ICON.check + 'Finns i dagsplanen</p>' : '<button class="btn btn-secondary" data-act="s-addplan" data-key="addplan" style="align-self:flex-start">' + ICON.plus + 'Lägg i dagsplanen</button>') +
      (V.planFull ? '<div class="confirm"><p>Dagsplanen har redan så många saker som din energi räcker till idag. Det är okej att vänta med övningen.</p><div class="row-end"><button class="btn btn-secondary" data-act="s-addplan-no">Vänta</button><button class="btn btn-primary" data-act="s-addplan-force">Lägg till ändå</button></div></div>' : '') +
      '<p class="sub">Du kan också göra den en annan dag. Det gör ingenting.</p></div>';
  } else {
    body = eyebrow + '<h1 id="q">' + C.reflektion.fraga + '</h1><p class="lead">Välj det som stämmer bäst. Det finns inga fel svar.</p>' +
      '<div class="choices" role="group" aria-labelledby="q">' + C.reflektion.val.map(function(r){
        return '<button class="choice" aria-pressed="false" data-act="s-reflect" data-id="' + r.id + '" data-key="r-' + r.id + '"><span class="c-icon">' + weatherIcon(r.id) + '</span><span class="c-text"><span class="c-title">' + r.text + '</span></span></button>';
      }).join('') + '</div>';
  }
  return '<div class="cat-' + cat.id + '" style="display:contents">' +
    topbar(step > 0 ? backBtn('s-back') : '', '<button class="btn-text" data-act="s-close" data-key="close">Stäng</button>') +
    '<main class="page flow"><div class="stack-lg">' + body + '</div></main>' +
    '<footer class="flowbar">' + stepbar(4, step) + (step < 3 ? '<button class="btn-round" data-act="s-next" data-key="next" aria-label="Nästa">' + ICON.arrow + '</button>' : '') + '</footer></div>';
}
function doneBackLabel(){
  var t = NAV[NAV.length - 1];
  if (!t || (t.name === 'tab' && t.tab === 'idag')) return 'Till Idag';
  if (t.name === 'program') return 'Till programmet';
  return 'Tillbaka';
}

    var st = progState(s.programId);

function vComing(){

function lenChoice(id, title, desc){
  var on = (S.settings.sessionLength || 'auto') === id;
  return '<button class="choice" aria-pressed="' + on + '" data-act="set-length" data-id="' + id + '" data-key="len-' + id + '"><span class="c-text"><span class="c-title">' + title + '</span><span class="c-desc">' + desc + '</span></span><span class="mark" aria-hidden="true">' + (on ? ICON.check : '') + '</span></button>';
}
function vProgram(){
  var p = PROG[V.id], c = CAT[p.kategori], st = progState(p.id), mine = S.program.id === p.id, paused = mine && S.program.paused, d = doneIds();
  var parts = p.delar.map(function(x){
    var done = d[x.id], next = st.next && st.next.id === x.id;
    var meta = !x.skriven ? 'Inte skriven än' : (done ? 'Gjord · ' : next ? 'Nästa · ' : '') + 'tar ' + minutesFor(x) + ' min';
    return '<li><button class="part' + (done ? ' is-done' : '') + (next ? ' is-next' : '') + '" data-act="open-session" data-id="' + x.id + '" data-key="part-' + x.id + '">' +
      '<span class="num" aria-hidden="true">' + (done ? ICON.check : x.del) + '</span>' +
      '<span class="p-text"><span class="p-title"><span class="sr-only">Del ' + x.del + ': </span>' + x.titel + '</span><span class="p-meta">' + meta + '</span></span>' + ICON.chevR + '</button></li>';
  }).join('');
  var primary = '';
  if (!mine) primary = '<button class="btn btn-primary" data-act="prog-choose" data-id="' + p.id + '" data-key="choose">Börja med programmet ' + ICON.arrow + '</button>';
  else if (paused) primary = '<button class="btn btn-primary" data-act="prog-resume" data-key="resume">Fortsätt programmet ' + ICON.arrow + '</button>';
  else if (st.next) primary = '<button class="btn btn-primary" data-act="open-session" data-id="' + st.next.id + '" data-key="nextpart">' + (st.done ? 'Fortsätt med del ' + st.next.del : 'Börja med del 1') + ' ' + ICON.arrow + '</button>';
  return topbar(backBtn(), '') +
    '<main class="page flow cat-' + c.id + '">' +
      '<div class="stack">' + illuBlock(c.id) + '<p class="eyebrow" style="margin-top:8px">Program · ' + st.total + ' delar' + (paused ? ' · pausat' : '') + '</p><h1>' + p.titel + '</h1><p>' + p.undertitel + '</p></div>' +
      '<section class="stack" aria-labelledby="h-parts"><h2 id="h-parts">Delar</h2><p class="sub">En del per dag räcker. Missar du en dag fortsätter du bara där du var.</p><ol class="parts">' + parts + '</ol></section>' +
      (mine && !paused ? '<section class="stack" aria-labelledby="h-pause"><h2 id="h-pause">Behöver du en paus?</h2><p>Programmet väntar på dig, och du fortsätter där du slutade. Under tiden visar Idag en kort strategi.</p><button class="btn btn-secondary" data-act="prog-pause" data-key="pause" style="align-self:flex-start">Pausa programmet</button></section>' : '') +
      '<section class="stack" aria-labelledby="h-len"><h2 id="h-len">Passens längd</h2>' +
        (S.profile.energyBaseline === 'lag' ? '<p class="sub">Just nu är alla pass korta, eftersom du har sagt att din energi oftast är låg.</p>' : '') +
        '<div class="choices" role="group" aria-labelledby="h-len">' + lenChoice('auto', 'Anpassa efter energin', 'Kortare på dagar med lite energi') + lenChoice('kort', 'Alltid korta', 'Under 3 minuter, utan film') + '</div>' +
      '</section>' +
    '</main>' + (primary ? '<footer class="flowbar"><span style="flex:1"></span>' + primary + '</footer>' : '');
}

    '<main class="page flow"><div class="stack-lg">' +
      '<h1>Vart kan jag vända mig?</h1><p class="lead">Appen är ett stöd i vardagen. Ibland behövs mer hjälp än så, och det är helt okej att be om den.</p>' +
      card({ urgent: true, title: 'Om det är akut', num: '112', text: 'Ring 112 om det gäller liv och hälsa.', actions: tel('112') }) +
      card({ title: 'Vårdrådgivning dygnet runt', num: '1177', text: 'Ring 1177 eller gå till 1177.se för råd om vart du ska vända dig.', actions: tel('1177') + web('1177.se', '1177.se') }) +
      card({ title: 'Om du har tankar på att ta ditt liv', num: '90101', text: 'Ring Självmordslinjen på 90101 eller chatta på mind.se. Öppet dygnet runt.', actions: tel('90101') + web('mind.se', 'mind.se') }) +
      card({ title: 'Din vårdcentral', text: 'Kontakta vårdcentralen via 1177.se eller telefon. Berätta vad som är svårt i vardagen. Du kan fråga om att träffa en arbetsterapeut. Ibland behövs en remiss, och den kan vårdcentralen skriva.' }) +
      card({ title: 'Intresseorganisationer', text: 'Här finns kunskap, gemenskap och stöd.', actions: web('attention.se', 'Riksförbundet Attention') + web('autism.se', 'Autism Sverige') + web('hjarnkraft.se', 'Hjärnskadeförbundet Hjärnkraft') }) +
      '<p class="sub">Autism Sverige hette tidigare Autism- och Aspergerförbundet. Sidan byggs ut i steg 3.</p>' +
    '</div></main>';
}
function vAbout(){
  return topbar(backBtn(), '') +
    '<main class="page flow"><div class="stack-lg"><h1>Om appen</h1><div class="prose">' +
      '<p>Småsteg är ett stöd för vardagen. Appen ersätter inte vård eller behandling.</p>' +
      '<p>Det du väljer och skriver sparas bara på den här enheten. Inget skickas någonstans.</p>' +
      '<p>Innehållet bygger på vanliga arbetsterapeutiska principer. Det ska granskas av en legitimerad arbetsterapeut innan appen används på riktigt.</p>' +
      '<p class="chip">Status: ej granskat · version ' + esc(C.version) + '</p>' +
    '</div></div></main>';
}
function vSettings(){
  return topbar(backBtn(), '') +
    '<main class="page flow"><div class="stack-lg"><h1>Inställningar</h1>' +
      '<div class="placeholder cat-planera" style="padding:18px"><span class="chip chip-dev">Byggs i steg 3</span><p>Textstorlek, uppläsning, mörkt läge, minskad rörelse och ändra mål.</p></div>' +
      '<h2>Återställ</h2>' +
      (V.confirmReset
        ? '<div class="confirm"><p><b>Vill du radera allt?</b> Dina svar, din dagsplan och det du har gjort försvinner från enheten.</p><div class="row-end"><button class="btn btn-secondary" data-act="reset-cancel" data-key="rc">Avbryt</button><button class="btn btn-primary" data-act="reset-do" data-key="rd">Ja, radera allt</button></div></div>'
        : '<button class="btn btn-secondary" data-act="reset-ask" data-key="reset" style="align-self:flex-start">Återställ all data</button>') +
    '</div></main>';
}

var VIEWS = {
  onboarding: vOnboarding, checkin: vCheckin,
  tab: function(){ return V.tab === 'utforska' ? vUtforska() : V.tab === 'framsteg' ? vFramsteg() : vIdag(); },
  session: vSession, done: vDone, coming: vComing, justnu: vJustNu, category: vCategory, program: vProgram,
  more: vMore, help: vHelp, about: vAbout, settings: vSettings
};

/* =========================================================
   Handlingar
   ========================================================= */
var CALM = ['Klart. Det räknas.', 'Gjort. Skönt att ha det bakom sig.', 'Klart. Ta en liten paus om du vill.'];
function announce(msg){ var el = document.getElementById('sr'); el.textContent = ''; setTimeout(function(){ el.textContent = msg; }, 50); }
function obStep(n){ S.obStep = n; save(); V = { name: 'onboarding', step: n }; render(); }
function obValid(){
  var P = S.profile;
  if (V.step === 0) return P.challenges.length > 0;
  if (V.step === 1) return P.lifeAreas.length > 0;
  if (V.step === 2) return !!P.energyBaseline;
  if (V.step === 3) return !!(P.goal && P.goal.text && P.goal.text.trim());
  return true;
}
function addPlanItem(text, extra){
  var plan = planToday();
  plan.items.push(Object.assign({ id: uid(), text: text, done: false, src: 'user' }, extra || {}));
  save();
}

var ACT = {
  /* onboarding */
  'ob-cat': function(el){
    var id = el.dataset.id, ch = S.profile.challenges, i = ch.indexOf(id);
    V.hint = '';
    if (i > -1) ch.splice(i, 1);
    else if (ch.length >= 2) { V.hint = 'Du har redan valt två. Tryck på ett av dem för att ta bort det först.'; announce(V.hint); }
    else ch.push(id);
    if (S.profile.goal && S.profile.goal.typ === 'forslag' && goalSuggestions().indexOf(S.profile.goal.text) < 0) S.profile.goal = null;
    save(); render(true);
  },
  'ob-area': function(el){
    var a = S.profile.lifeAreas, i = a.indexOf(el.dataset.id);
    if (i > -1) a.splice(i, 1); else a.push(el.dataset.id);
    V.hint = ''; save(); render(true);
  },
  'ob-energy': function(el){ S.profile.energyBaseline = el.dataset.id; V.hint = ''; save(); render(true); },
  'ob-goal': function(el){ S.profile.goal = { text: goalSuggestions()[+el.dataset.idx], typ: 'forslag' }; V.ownGoal = false; V.hint = ''; save(); render(true); },
  'ob-goal-own': function(){
    V.ownGoal = true; V.hint = '';
    if (!S.profile.goal || S.profile.goal.typ !== 'eget') S.profile.goal = { text: '', typ: 'eget' };
    save(); render('focus');
  },
  'ob-next': function(){
    if (!obValid()) { V.hint = 'Välj något först, eller tryck på Hoppa över uppe till höger.'; render(true); announce(V.hint); return; }
    V.hint = ''; obStep(V.step + 1);
  },
  'ob-back': function(){ V.hint = ''; obStep(Math.max(0, V.step - 1)); },
  'ob-skip': function(){ obStep(V.step + 1); },
  'ob-finish': function(){
    S.onboarded = true; S.obStep = 0;
    S.program = { id: programIdForProfile(), paused: false, started: today() };
    save(); go(needsCheckin() ? { name: 'checkin' } : { name: 'tab', tab: 'idag' });
  },
  /* energi */
  'checkin-set': function(el){ S.energy[today()] = el.dataset.id; save(); NAV = []; go({ name: 'tab', tab: 'idag' }); },
  'checkin-skip': function(){ S.checkinSkipped = today(); save(); go({ name: 'tab', tab: 'idag' }); },
  'checkin-change': function(){ go({ name: 'checkin' }); },
  'checkin-back': function(){ go({ name: 'tab', tab: 'idag' }); },
  /* navigering */
  'tab': function(el){ NAV = []; go({ name: 'tab', tab: el.dataset.tab }); },
  'back': back,
  'open-more': function(){ push({ name: 'more' }); },
  'open-help': function(){ push({ name: 'help' }); },
  'open-about': function(){ push({ name: 'about' }); },
  'open-settings': function(){ push({ name: 'settings' }); },
  'open-justnu': function(el){ push({ name: 'justnu', id: el.dataset.id }); },
  'show-next': function(){ V.showNext = true; render(true); },
  /* session */
  'start-session': function(){
    var s = progState(currentProgram().id).next;
    if (!s) return;
    if (!s.skriven) { push({ name: 'coming', sid: s.id }); return; }
    push({ name: 'session', sid: s.id, step: 0 });
  },
  's-next': function(){ V.step = Math.min(3, V.step + 1); V.planFull = false; render(); },
  's-back': function(){ V.step = Math.max(0, V.step - 1); V.planFull = false; render(); },
  's-close': function(){ back(); },
  'listen': function(){ var s = SESS[V.sid]; TTS.toggle(sessionText(s, V.step, isShort())); },
  'video': function(){ toast('Filmen är inte inspelad än. Texten nedanför säger samma sak.'); },
  's-addplan': function(){
    var plan = planToday(), slots = slotsToday() + (plan.extra || 0);
    if (plan.items.length >= slots) { V.planFull = true; render(true); return; }
    var s = SESS[V.sid]; addPlanItem(s.ovning.dagsplan, { src: 'session', sessionId: s.id });
    toast('Tillagd i dagsplanen.'); render(true);
  },
  's-addplan-force': function(){
    var plan = planToday(), s = SESS[V.sid];
    plan.extra = (plan.extra || 0) + 1;
    addPlanItem(s.ovning.dagsplan, { src: 'session', sessionId: s.id });
    V.planFull = false; toast('Tillagd i dagsplanen.'); render(true);
  },
  's-addplan-no': function(){ V.planFull = false; render(true); },
  's-reflect': function(el){
    var s = SESS[V.sid];
    S.completed.push({ sessionId: s.id, programId: s.programId || null, typ: s.typ, date: today(), reflection: el.dataset.id });
    save(); go({ name: 'done', sid: s.id, reflection: el.dataset.id });
  },
  /* utforska och program */
  'open-cat': function(el){ push({ name: 'category', id: el.dataset.id }); },
  'open-program': function(el){ push({ name: 'program', id: el.dataset.id }); },
  'open-session': function(el){
    var s = SESS[el.dataset.id];
    if (!s) return;
    push(s.skriven ? { name: 'session', sid: s.id, step: 0 } : { name: 'coming', sid: s.id });
  },
  'prog-choose': function(el){
    var old = currentProgram(), id = el.dataset.id, kept = old.id !== id && progState(old.id).done > 0;
    S.program = { id: id, paused: false, started: today() }; save(); render(true);
    toast('Idag visar nu ' + PROG[id].titel.toLowerCase() + '.' + (kept ? ' Det du gjort i ' + old.titel.toLowerCase() + ' finns kvar.' : ''));
  },
  'prog-pause': function(){ S.program.paused = true; save(); render(true); toast('Programmet är pausat. Det väntar på dig.'); },
  'prog-resume': function(){ S.program.paused = false; save(); render(true); toast('Programmet är igång igen.'); },
  'set-length': function(el){ S.settings.sessionLength = el.dataset.id; save(); render(true); },
  /* dagsplan */
  'plan-add': function(){ V.planEdit = true; render('focus'); },
  'plan-cancel': function(){ V.planEdit = false; render(true); },
  'plan-idea': function(el){ addPlanItem(el.dataset.text); V.planEdit = false; render(true); },
  'plan-toggle': function(el){
    var it = planToday().items.filter(function(i){ return i.id === el.dataset.id; })[0];
    if (!it) return;
    it.done = !it.done;
    V.reflectFor = it.done && it.src === 'session' && !it.reflection ? it.id : null;
    save(); render(true);
    if (it.done && !V.reflectFor) toast(CALM[Math.floor(Math.random() * CALM.length)]);
  },
  'plan-remove': function(el){
    var plan = planToday(), idx = -1;
    plan.items.forEach(function(i, n){ if (i.id === el.dataset.id) idx = n; });
    if (idx < 0) return;
    var removed = plan.items.splice(idx, 1)[0];
    save(); render(true);
    toast('Borttagen.', { label: 'Ångra', fn: function(){ planToday().items.splice(idx, 0, removed); save(); render(true); } });
  },
  'plan-reflect': function(el){
    var it = planToday().items.filter(function(i){ return i.id === el.dataset.id; })[0];
    var r = C.reflektion.val.filter(function(x){ return x.id === el.dataset.r; })[0];
    if (!it || !r) return;
    it.reflection = r.id; V.reflectFor = null; save(); render(true);
    var f = $app.querySelector('[data-key="pt-' + it.id + '"]'); if (f) f.focus({ preventScroll: true });
    toast(r.svarKort);
  },
  'plan-extra': function(){ planToday().extra = (planToday().extra || 0) + 1; save(); V.planEdit = true; render('focus'); },
  /* återställ */
  'reset-ask': function(){ V.confirmReset = true; render(true); },
  'reset-cancel': function(){ V.confirmReset = false; render(true); },
  'reset-do': function(){ try { localStorage.removeItem(KEY); } catch (e) {} S = defaultState(); NAV = []; go({ name: 'onboarding', step: 0 }); toast('Allt är raderat.'); }
};

$app.addEventListener('click', function(e){
  var el = e.target.closest('[data-act]');
  if (!el || !$app.contains(el)) return;
  var fn = ACT[el.dataset.act];
  if (fn) { e.preventDefault(); fn(el, e); }
});
$app.addEventListener('submit', function(e){
  if (e.target.dataset.form === 'plan') {
    e.preventDefault();
    var v = document.getElementById('plan-input').value.trim();
    if (!v) { document.getElementById('plan-input').focus(); return; }
    addPlanItem(v); V.planEdit = false; render(true);
  }
});
$app.addEventListener('input', function(e){
  if (e.target.id === 'goal-input') {
    S.profile.goal = { text: e.target.value, typ: 'eget' }; save();
    var c = document.getElementById('goal-count');
    if (c) c.textContent = e.target.value.length + ' av 90 tecken';
  }
});
$app.addEventListener('keydown', function(e){
  if (e.key === 'Enter' && e.target.id === 'goal-input') { e.preventDefault(); ACT['ob-next'](); }
});

/* =========================================================
   Start
   ========================================================= */
TTS.init();
V = initialView();
render();
S.lastVisit = today(); save();
})();
</script>
</body>
</html>
